
plugins {
    id 'java'
    id 'io.qameta.allure' version '4.3.0'
}

group = 'com.leegality'
version = '1.0'

repositories {
    mavenCentral()
}

dependencies {
    // API Automation
    implementation 'io.rest-assured:rest-assured:5.5.6'

    // TestNG
    testImplementation 'org.testng:testng:7.11.0'

    // JSON Schema Validation
    testImplementation 'io.rest-assured:json-schema-validator:5.5.6'

    // Allure Reporting
    testImplementation 'io.qameta.allure:allure-testng:2.35.5'
}

allure {
    version = '3.14.3'

    adapter {
        allureJavaVersion = '2.35.5'
        autoconfigure = true
        autoconfigureListeners = true
        aspectjWeaver = true

        frameworks {
            testng {
                enabled = true
                autoconfigureListeners = true
            }
        }
    }
}

test {
    useTestNG()
    finalizedBy allureReport

    testLogging {
        events "passed", "failed", "skipped"
        showStandardStreams = true
    }
}
